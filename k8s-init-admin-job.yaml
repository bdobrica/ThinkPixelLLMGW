# One-time bootstrap Job. Create llm-gateway-bootstrap, llm-gateway-db, and
# llm-gateway-secrets first; see docs/bootstrap-admin.md. Pin the image digest,
# namespace, and policy metadata for the target environment before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-gateway-init-admin
  namespace: default
  labels:
    app: llm-gateway
    component: init-admin
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: llm-gateway
        component: init-admin
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-admin
          image: your-registry/llm-gateway@sha256:replace-with-qualified-digest
          command: ["/app/init-admin"]
          env:
            - name: ADMIN_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-bootstrap
                  key: email
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-bootstrap
                  key: password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-db
                  key: url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: jwt-secret
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: metrics-auth-token
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: encryption-key
            - name: DB_MAX_OPEN_CONNS
              value: "5"
            - name: DB_MAX_IDLE_CONNS
              value: "2"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
